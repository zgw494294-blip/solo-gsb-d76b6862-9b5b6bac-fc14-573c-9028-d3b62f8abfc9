services:
  firmware-api:
    build: .
    image: firmware-rollout-api:latest
    container_name: firmware-rollout-api
    ports:
      - "8080:8080"
    volumes:
      - firmware-data:/data
    environment:
      DB_PATH: /data/firmware.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  firmware-data:
